
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hatim El Badaoui | Digital Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #818cf8;
            --secondary: #c084fc;
            --accent: #fb7185;
        }
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            scroll-behavior: smooth;
            background: #050505;
            overflow-x: hidden;
            color: #fafafa;
        }

        /* Magical background effect - ensure pointer-events-none */
        .mesh-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
            background: 
                radial-gradient(circle at 0% 0%, rgba(129, 140, 248, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(192, 132, 252, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(5, 5, 5, 1) 0%, rgba(5, 5, 5, 1) 100%);
        }

        .blob {
            position: absolute;
            width: 600px;
            height: 600px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            filter: blur(140px);
            border-radius: 50%;
            opacity: 0.12;
            z-index: -1;
            pointer-events: none;
            animation: float 25s infinite alternate ease-in-out;
        }

        @keyframes float {
            0% { transform: translate(0, 0) rotate(0deg) scale(1); }
            33% { transform: translate(60px, -80px) rotate(10deg) scale(1.2); }
            66% { transform: translate(-40px, 40px) rotate(-10deg) scale(0.9); }
            100% { transform: translate(0, 0) rotate(0deg) scale(1); }
        }

        @keyframes gradient-x {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .animate-gradient-x {
            background-size: 200% 200%;
            animation: gradient-x 8s ease infinite;
        }

        .reveal {
            opacity: 0;
            transform: translateY(40px);
            transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .glass-card:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(129, 140, 248, 0.3);
            transform: translateY(-12px) scale(1.01);
            box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.6);
        }

        .gradient-border {
            position: relative;
            background: #08080a;
            border-radius: 32px;
            z-index: 1;
        }

        .gradient-border::before {
            content: "";
            position: absolute;
            top: -1px; left: -1px; right: -1px; bottom: -1px;
            background: linear-gradient(45deg, var(--primary), var(--secondary), var(--accent));
            border-radius: 33px;
            z-index: -1;
            opacity: 0.1;
            transition: opacity 0.5s ease;
        }

        .gradient-border:hover::before {
            opacity: 1;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: #1a1a1a; border-radius: 10px; border: 2px solid #050505; }
        ::-webkit-scrollbar-thumb:hover { background: #2a2a2a; }

        .carousel-track {
            display: flex;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .mask-linear {
            mask-image: linear-gradient(to right, transparent, black 15%, black 85%, transparent);
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
  }
}
</script>
</head>
<body class="bg-[#050505] text-zinc-100 selection:bg-indigo-500/40">
    <div class="mesh-gradient"></div>
    <div class="blob top-[-10%] left-[-5%]"></div>
    <div class="blob bottom-[10%] right-[-5%]" style="animation-delay: -7s; background: linear-gradient(135deg, var(--secondary), var(--accent));"></div>
    
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
</body>
</html>
